  <text x="60" y="258" class="serif">Forecast</text><text x="60" y="306" class="serif" fill="#d96f52">fits.</text>
  <rect x="54" y="332" width="510" height="380" rx="24" fill="#dfe9e2" stroke="#ccd9d2" stroke-width="2"/>
  <circle cx="308" cy="503" r="146" fill="none" stroke="#a8bdb4" stroke-width="2"/>
  <circle cx="308" cy="503" r="171" fill="none" stroke="#a8bdb4" stroke-width="2" stroke-dasharray="4 9"/>
  <circle cx="308" cy="430" r="48" fill="#e5b58d"/><path d="M262 428q0-52 46-52t46 52q-18-18-44-18t-48 18" fill="#4f413c"/>
