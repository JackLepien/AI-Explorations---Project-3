<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Digital wireframe: Forecast Fits main screen, laptop</title>
  <desc id="desc">Landscape layout with search and date controls above a large character illustration on the left and forecast, reminders, and travel window on the right.</desc>
  <defs>
    <style>
      .ink{fill:#29363a;font:600 18px Arial,sans-serif}.small{fill:#6b7773;font:14px Arial,sans-serif}.label{fill:#65716c;font:700 12px Arial,sans-serif;letter-spacing:2px}.serif{fill:#29363a;font:700 44px Georgia,serif}.card{fill:#fffdf7;stroke:#ded8cd;stroke-width:2}.line{stroke:#e4dfd4;stroke-width:2}.sketch{fill:none;stroke:#82978e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#f5f0e6"/>
  <text x="58" y="57" class="ink">ff  forecast fits</text><text x="1010" y="57" class="small">ABOUT THIS PROJECT</text>
  <path d="M52 79H1228" class="line"/>
  <rect x="54" y="103" width="392" height="54" rx="12" class="card"/><text x="76" y="137" class="small">Search a US city or state</text>
  <rect x="462" y="103" width="190" height="54" rx="12" fill="#fffdf7" stroke="#ded8cd" stroke-width="2"/><text x="485" y="137" class="small">◎  Use my location</text>
